
<div class="flex min-h-screen items-center justify-center
            bg-slate-100 px-5 py-10">

  <div class="w-full max-w-md rounded-2xl
              bg-white p-8 shadow-lg">

    <div class="mb-8 text-center">

      <div class="mx-auto flex h-14 w-14 items-center
                  justify-center rounded-2xl
                  bg-slate-900 text-2xl font-bold text-white">
        SI
      </div>

      <h1 class="mt-5 text-2xl font-bold text-slate-900">
        Sistema Inmobiliario
      </h1>

      <p class="mt-2 text-sm text-slate-500">
        Inicie sesión con su cuenta de empleado.
      </p>

    </div>

    @if (mensaje) {
      <div class="mb-5 rounded-lg bg-red-50
                  p-4 text-sm text-red-700">
        {{ mensaje }}
      </div>
    }

    <form (ngSubmit)="ingresar()" #loginForm="ngForm">

      <div>
        <label class="mb-2 block text-sm font-medium">
          Correo electrónico
        </label>

        <input
          type="email"
          name="email"
          [(ngModel)]="email"
          required
          email
          autocomplete="username"
          placeholder="empleado@empresa.com"
          class="w-full rounded-lg border
                 border-slate-300 px-4 py-3
                 focus:border-slate-700
                 focus:outline-none">
      </div>

      <div class="mt-5">
        <label class="mb-2 block text-sm font-medium">
          Contraseña
        </label>

        <input
          type="password"
          name="contrasena"
          [(ngModel)]="contrasena"
          required
          autocomplete="current-password"
          placeholder="Ingrese su contraseña"
          class="w-full rounded-lg border
                 border-slate-300 px-4 py-3
                 focus:border-slate-700
                 focus:outline-none">
      </div>

      <button
        type="submit"
        [disabled]="loginForm.invalid || cargando"
        class="mt-7 w-full rounded-lg bg-slate-900
               px-5 py-3 font-semibold text-white
               hover:bg-slate-700 disabled:opacity-50">

        {{ cargando
           ? 'Ingresando...'
           : 'Iniciar sesión' }}
      </button>

    </form>

    <p class="mt-6 text-center text-xs text-slate-500">
      Acceso exclusivo para personal autorizado.
    </p>

  </div>

</div>
